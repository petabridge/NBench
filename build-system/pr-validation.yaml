trigger:
  branches:
    include:
      - master
      - dev
      - main

pr:
  branches:
    include:
      - master
      - dev
      - main

jobs:
- job: LinuxTest
  displayName: 'Test on Linux'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: Checkout@2
    displayName: 'Checkout'
    inputs:
      lfs: true
      fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - name: 'Update release notes'
    shell: pwsh
    run: |
      ./build.ps1

  - script: dotnet build -c Release
    displayName: 'dotnet build'

  - script: dotnet pack -c Release
    displayName: 'dotnet pack'

  - script: dotnet test --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    displayName: 'dotnet test (Linux)'

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/*.trx'
      testRunTitle: 'Test Results'
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Upload Test Result Files'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/**/TestResults/**/*'
      ArtifactName: 'test-results'
      retentionDays: 5

- job: WindowsTest
  displayName: 'Test on Windows'
  pool:
    vmImage: 'windows-latest'
  steps:
  - task: Checkout@2
    displayName: 'Checkout'
    inputs:
      lfs: true
      fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - name: 'Update release notes'
    shell: pwsh
    run: |
      ./build.ps1
    

  - script: dotnet build -c Release
    displayName: 'dotnet build'

  - script: dotnet pack -c Release
    displayName: 'dotnet pack'

  - script: dotnet test --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    displayName: 'dotnet test (Windows)'

- job: LinuxNBench
  displayName: 'NBench on Linux'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: Checkout@2
    displayName: 'Checkout'
    inputs:
      lfs: true
      fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      installationPath: $(Agent.ToolsDirectory)/dotnet
      useGlobalJson: true

  - script: ./scripts/execNBenchProjects.ps1
    displayName: 'Run NBench Projects'
    condition: always()
    shell: pwsh

- job: WindowsNBench
  displayName: 'NBench on Windows'
  pool:
    vmImage: 'windows-latest'
  steps:
  - task: Checkout@2
    displayName: 'Checkout'
    inputs:
      lfs: true
      fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      installationPath: $(Agent.ToolsDirectory)/dotnet
      useGlobalJson: true

  - script: ./scripts/execNBenchProjects.ps1
    displayName: 'Run NBench Projects'
    condition: always()
    shell: pwsh
