trigger:
  branches:
    include:
      - master
      - dev
      - main

pr:
  branches:
    include:
      - master
      - dev
      - main

jobs:
- job: LinuxTest
  displayName: 'Test on Linux'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - powershell: ./build.ps1
    displayName: 'Update Release Notes'

  - script: dotnet build -c Release
    displayName: 'dotnet build'

  - script: dotnet pack -c Release
    displayName: 'dotnet pack'

  - script: dotnet test --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    displayName: 'dotnet test (Linux)'

  - task: PublishTestResults@2
    inputs:
      testRunner: VSTest
      testResultsFiles: '**/*.trx' #TestResults folder usually
      testRunTitle: ${{ parameters.name }}
      mergeTestResults: true

  - task: PublishBuildArtifacts@1
    displayName: 'Upload Test Result Files'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/**/TestResults/**/*'
      ArtifactName: 'test-results'
      retentionDays: 5

- job: WindowsTest
  displayName: 'Test on Windows'
  pool:
    vmImage: 'windows-latest'
  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - powershell: ./build.ps1
    displayName: 'Update Release Notes'

  - script: dotnet build -c Release
    displayName: 'dotnet build'

  - script: dotnet pack -c Release
    displayName: 'dotnet pack'

  - script: dotnet test --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    displayName: 'dotnet test (Windows)'

  - task: PublishTestResults@2
    inputs:
      testRunner: VSTest
      testResultsFiles: '**/*.trx' #TestResults folder usually
      testRunTitle: ${{ parameters.name }}
      mergeTestResults: true

- job: LinuxNBench
  displayName: 'NBench on Linux'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      installationPath: $(Agent.ToolsDirectory)/dotnet
      useGlobalJson: true

  - powershell: ./scripts/execNBenchProjects.ps1
    displayName: 'Run NBench Projects'

- job: WindowsNBench
  displayName: 'NBench on Windows'
  pool:
    vmImage: 'windows-latest'
  steps:
  - checkout: self
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      installationPath: $(Agent.ToolsDirectory)/dotnet
      useGlobalJson: true

  - powershell: ./scripts/execNBenchProjects.ps1
    displayName: 'Run NBench Projects'